<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="SahiRep on-device pose detection preview">
  <title>SahiRep Pose Preview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M22 10c-1.4-1.3-3.4-2-5.7-2-3.1 0-5.3 1.5-5.3 3.8 0 2.1 1.6 3.2 5.1 4 2.2.5 3 1 3 2 0 1.2-1.2 2-3 2-2.2 0-4.2-.8-5.7-2.3L8 20.3c2 1.8 4.8 2.7 7.8 2.7 3.8 0 6.2-1.8 6.2-4.7 0-2.5-1.7-3.8-5.4-4.6-2-.5-2.7-.9-2.7-1.7 0-.8.9-1.3 2.4-1.3 1.6 0 3 .5 4.1 1.6Z' fill='%234ade80'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">SahiRep</p>
      <h1>Live pose preview</h1>
      <p class="subtitle">Stage 1: on-device camera skeleton tracking</p>
    </header>

    <section class="preview-card" aria-labelledby="preview-heading">
      <h2 class="visually-hidden" id="preview-heading">Webcam pose detection</h2>

      <div class="camera-stage" id="camera-stage">
        <video
          id="camera-video"
          autoplay
          muted
          playsinline
          aria-label="Live webcam feed"
        ></video>
        <canvas
          id="pose-canvas"
          role="img"
          aria-label="Detected pose skeleton overlay"
        >Your browser does not support canvas.</canvas>

        <p class="privacy-badge">On-device only</p>
      </div>

      <div class="status-row">
        <span class="status-dot" aria-hidden="true"></span>
        <p id="status" role="status" aria-live="polite">Ready - press Start camera</p>
      </div>

      <button class="button" id="start-camera" type="button">Start camera</button>
      <p class="privacy-copy">Video frames stay in this browser and are never uploaded.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
