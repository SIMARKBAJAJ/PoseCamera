# Local development services only (Postgres + Redis). Not a production config: dev password, no TLS.
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg://sahirep:sahirep-dev@127.0.0.1:5432/sahirep
#   export RATELIMIT_STORAGE_URI=redis://127.0.0.1:6379   # needs `uv add redis`
#   flask --app app:create_app db upgrade
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sahirep
      POSTGRES_PASSWORD: sahirep-dev
      POSTGRES_DB: sahirep
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahirep -d sahirep"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
